# Vulkan HAL shim override list (loaded from /vendor/etc/wwm_vkhook.conf by the
# wwm_vkhook build of /vendor/lib{64,}/hw/vulkan.virtio.so). Format:
#   <process cmdline>|<vendorID>|<deviceID>|<deviceName>
# 0 for vendorID or deviceID keeps the Venus value. Lines starting with # are skipped.
#
# Where Winds Meet (NetEase Messiah engine, Vulkan direct) only enters the 3D render path
# for a GPU in its mobile whitelist. Reporting a Qualcomm Adreno 740 keeps rendering on
# Venus / NVIDIA while making the engine happy.
com.netease.yyvn|0x5143|0x43050a01|Adreno (TM) 740
